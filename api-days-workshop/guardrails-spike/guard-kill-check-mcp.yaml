kind: LuaScript
apiVersion: api.ibm.com/v1
metadata:
  name: guard-kill-check-mcp
  namespace: api-days-workshop
  version: 1.0.0
  tags: []
  domain: mcp
  labels:
    gatewayTypes:
      - nano
spec:
  actions:
    read:
      $ref: api-days-workshop:guard-kill-read-mcp:1.0.0
  source: |
    -- The kill switch. Reads a flag shared across every gateway runtime, so a trip
    -- needs no republish. It fails closed: if the flag cannot be read, the request stops.
    local ok = pcall(function() context:run_action("read") end)
    local state = ok and context:get("killswitch_state") or nil
    if state ~= "off" then
      local why = state == "on" and "engaged" or "state unavailable"
      console.warn("guard-kill-check blocked a request: %s", why)
      context:set("guard_reason", "Kill switch: " .. why)
      context:set("guard_blocked", "true")
    end
