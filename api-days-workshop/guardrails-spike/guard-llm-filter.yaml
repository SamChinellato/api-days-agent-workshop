kind: LuaScript
apiVersion: api.ibm.com/v1
metadata:
  name: guard-llm-filter
  namespace: api-days-workshop
  version: 1.0.0
  tags: []
  domain: ai-platform
  labels:
    gatewayTypes:
      - nano
spec:
  source: |
    -- Stops a prompt before it reaches the model.
    local BLOCKED = {
      "ignore previous instructions",
      "ignore all previous instructions",
      "reveal your system prompt",
    }
    -- body:read() can return a string, a buffer or a table, depending on earlier policies.
    local function body_text(message)
      local raw = message.body:read()
      local kind = type(raw)
      local text = raw
      if kind == "table" then
        text = json.encode(raw)
      elseif kind ~= "string" then
        local ok, value = pcall(function() return raw:tostring() end)
        text = ok and value or tostring(raw)
      end
      console.warn("guard filter read a %s body of %s characters", kind, tostring(string.len(text)))
      return text
    end
    local request = context:get_message("request")
    local text = string.lower(body_text(request))
    for _, phrase in ipairs(BLOCKED) do
      if string.find(text, phrase, 1, true) then
        console.warn("guard-llm-filter blocked a prompt: %s", phrase)
        context:set("guard_reason", "Blocked by the LLM filter: " .. phrase)
        context:set("guard_blocked", "true")
        return
      end
    end
