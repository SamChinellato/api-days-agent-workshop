kind: LuaScript
apiVersion: api.ibm.com/v1
metadata:
  name: guard-mcp-filter
  namespace: api-days-workshop
  version: 1.0.0
  tags: []
  domain: mcp
  labels:
    gatewayTypes:
      - nano
spec:
  source: |
    -- Filters tool calls by argument before they reach the MCP server. In a tool's assembly,
    -- read() returns only that tool's arguments, as a table.
    local BLOCKED_ARGUMENTS = { "supplier-05" }
    local raw = context:get_message("request").body:read()
    local arguments = type(raw) == "table" and json.encode(raw) or tostring(raw)
    for _, value in ipairs(BLOCKED_ARGUMENTS) do
      if string.find(arguments, value, 1, true) then
        context:set("guard_reason", "Blocked by the MCP filter: argument " .. value)
        context:set("guard_blocked", "true")
      end
    end
