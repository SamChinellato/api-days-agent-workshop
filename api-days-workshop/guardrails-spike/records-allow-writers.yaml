kind: LuaScript
apiVersion: api.ibm.com/v1
metadata:
  name: records-allow-writers
  namespace: api-days-workshop
  version: 1.0.0
  tags: []
  domain: mcp
  labels:
    gatewayTypes:
      - nano
spec:
  source: |
    -- Allows this tool for the groups below, using the person's token. Authenticate has
    -- already validated its signature, issuer, audience and expiry. Each tool has its own
    -- sequence because a tool's assembly only sees its arguments, not the tool name.
    local ALLOWED = { ["analyst-actions"] = true }
    local ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
    local function base64url_decode(input)
      local out, buffer, bits = {}, 0, 0
      for i = 1, #input do
        local index = string.find(ALPHABET, string.sub(input, i, i), 1, true)
        if index then
          buffer = buffer * 64 + (index - 1)
          bits = bits + 6
          if bits >= 8 then
            bits = bits - 8
            local divisor = 2 ^ bits
            out[#out + 1] = string.char(math.floor(buffer / divisor) % 256)
            buffer = buffer % divisor
          end
        end
      end
      return table.concat(out)
    end
    local request = context:get_message("request")
    local header = request.headers:get("authorization") or ""
    local token = string.gsub(header, "^[Bb]earer%s+", "")
    local payload = string.match(token, "^[^.]+%.([^.]+)%.")
    local decoded, claims = pcall(function() return json.decode(base64url_decode(payload)) end)
    local who = "unknown"
    if decoded and type(claims) == "table" then
      who = tostring(claims.preferred_username or claims.sub or who)
      local groups = claims.groups
      if type(groups) == "string" then
        groups = { groups }
      end
      for _, group in ipairs(groups or {}) do
        if ALLOWED[group] then
          request.headers:set("x-obo-token", token)
          return
        end
      end
    end
    context:set("guard_reason", who .. " is not allowed to use this tool")
    context:set("guard_blocked", "true")
