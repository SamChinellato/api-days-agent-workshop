kind: LuaScript
apiVersion: api.ibm.com/v1
metadata:
  name: records-identity-check
  namespace: api-days-workshop
  version: 1.0.0
  tags: []
  domain: mcp
  labels:
    gatewayTypes:
      - nano
spec:
  source: |
    -- Decides from the person's groups whether they may use this tool. Authenticate has
    -- already validated the token's signature, issuer, audience and expiry.
    local POLICY = {
      list_records = { ["analyst-readonly"] = true, ["analyst-actions"] = true },
      list_contacts = { ["analyst-readonly"] = true, ["analyst-actions"] = true },
      update_contact = { ["analyst-actions"] = true },
    }
    local ALPHABET = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_"
    local function base64url_decode(input)
      local out, buffer, bits = {}, 0, 0
      for i = 1, #input do
        local index = string.find(ALPHABET, string.sub(input, i, i), 1, true)
        if index then
          buffer = buffer * 64 + (index - 1)
          bits = bits + 6
          if bits >= 8 then
            bits = bits - 8
            local divisor = 2 ^ bits
            out[#out + 1] = string.char(math.floor(buffer / divisor) % 256)
            buffer = buffer % divisor
          end
        end
      end
      return table.concat(out)
    end
    local function deny(reason)
      console.warn("records-identity-check denied: %s", reason)
      context:set("guard_reason", reason)
      context:set("guard_blocked", "true")
    end
    local request = context:get_message("request")
    local raw = request.body:read()
    local body = raw
    if type(raw) == "table" then
      body = json.encode(raw)
    elseif type(raw) ~= "string" then
      local ok, value = pcall(function() return raw:tostring() end)
      body = ok and value or tostring(raw)
    end
    local parsed, message = pcall(json.decode, body)
    if not parsed or type(message) ~= "table" then
      return deny("Could not read the request")
    end
    if message.method ~= "tools/call" then
      return
    end
    local tool = message.params and message.params.name or ""
    local header = request.headers:get("authorization") or ""
    local token = string.gsub(header, "^[Bb]earer%s+", "")
    local payload = string.match(token, "^[^.]+%.([^.]+)%.")
    local decoded, claims = pcall(function() return json.decode(base64url_decode(payload)) end)
    if not decoded or type(claims) ~= "table" then
      return deny("Could not read the identity token")
    end
    local allowed_groups = POLICY[tool]
    if not allowed_groups then
      return deny("Tool " .. tostring(tool) .. " is not available through this gateway")
    end
    local groups = claims.groups
    if type(groups) == "string" then
      groups = { groups }
    end
    local who = tostring(claims.preferred_username or claims.sub or "unknown")
    for _, group in ipairs(groups or {}) do
      if allowed_groups[group] then
        request.headers:set("x-obo-token", token)
        return
      end
    end
    deny(who .. " is not allowed to use " .. tostring(tool))
